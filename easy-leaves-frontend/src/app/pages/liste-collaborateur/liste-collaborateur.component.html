<div class="menu">
	<button [class.selected]="vueActive === 'liste'" (click)="changerVue('liste')">Liste Congés par département</button>
	<button [class.selected]="vueActive === 'histogramme'" (click)="changerVue('histogramme')">Histogramme par département</button>
	<button [class.selected]="vueActive === 'gestionAbsences'" (click)="changerVue('gestionAbsences')">Gestion des Absences</button>
</div>

<div class="contenu">
  <!-- Affiche Gestion des Absences si vueActive est 'gestionAbsences' -->
  <app-liste-conges *ngIf="vueActive === 'liste'"/>
  <app-gestion-absences *ngIf="vueActive === 'gestionAbsences'"/>

  <!-- Affiche une autre section si vueActive est 'autreOption' -->
  <div *ngIf="vueActive === 'histogramme'">
    <h1>Autre Option</h1>
    <p>Contenu pour l'autre option...</p>
  </div>
</div>
